# Public repo: ubuntu-latest. Estate contract: PR-only CI, guards folded in.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog filesystem tip scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          cat > /tmp/th-exclude <<'EOF'
          (^|/)(node_modules|vendor|dist|build|\.git)(/|$)
          (^|/)package-lock\.json$
          (^|/)composer\.lock$
          (^|/)google-services\.json$
          (^|/)_wildcard\.localhost.*-key\.pem$
          (^|/)openpgp\.js$
          (^|/)(\.agents/vendor-src)(/|$)
          EOF
          trufflehog filesystem . \
            --fail \
            --no-update \
            --exclude-paths=/tmp/th-exclude \
            --results=verified,unknown

  security-audit:
    name: Python security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Static security scan
        run: bandit -q -r scripts hooks --severity-level medium

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  test:
    name: Tests and runner checks
    needs: [trufflehog, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Shell syntax checks
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n hooks/pre-commit-seo-check.sh

      - name: Runner compile checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          runner_scripts = sorted(Path("scripts").glob("*.py"))
          if not runner_scripts:
              raise SystemExit("No runner scripts found under scripts/")

          for script in runner_scripts:
              py_compile.compile(str(script), doraise=True)

          py_compile.compile("hooks/validate-schema.py", doraise=True)
          print(f"Compiled {len(runner_scripts)} runner scripts + hooks/helpers.")
          PY

      - name: Runner help checks
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          runner_scripts = sorted(Path("scripts").glob("*.py"))
          failures = []
          for script in runner_scripts:
              proc = subprocess.run(
                  [sys.executable, str(script), "--help"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if proc.returncode != 0:
                  failures.append(str(script))

          if failures:
              print("Help checks failed for:")
              for f in failures:
                  print(f" - {f}")
              raise SystemExit(1)

          print(f"Help checks passed for {len(runner_scripts)} runner scripts.")
          PY

      - name: Tests
        run: python -m pytest tests/

      - name: Contract smoke
        run: |
          python scripts/run_skill_workflow.py --skill seo-dataforseo https://example.com --json
          python scripts/run_skill_workflow.py --skill seo-image-gen https://example.com --json
